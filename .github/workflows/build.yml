name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: hanpeter/beanquest
            file: docker/beanquest/Dockerfile
            cache-scope: beanquest
          - image: hanpeter/beanquest-migrator
            file: docker/beanquest-migrator/Dockerfile
            cache-scope: beanquest-migrator
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
      - name: Docker Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  migrate:
    name: Apply DB migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions: {}
    # dbmate takes no lock, so never run two migrations at once, even across tags.
    concurrency:
      group: beanquest-migrate
      cancel-in-progress: false
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Apply dbmate migrations on a one-off Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}-migrator:${GITHUB_REF_NAME#v}"
          NAME="migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # `flyctl machine run` returns once the machine has started and never reports
          # the container's exit code, so wait for it to stop and read the code ourselves.
          flyctl machine run "${IMAGE}" migrate -a beanquest --name "${NAME}" \
            --region lax --vm-memory 256 --restart no --detach
          ID="$(flyctl machine list -a beanquest --json | jq -r --arg n "${NAME}" '.[] | select(.name == $n) | .id')"
          test -n "${ID}"
          trap 'flyctl machine destroy "${ID}" -a beanquest --force' EXIT
          flyctl machine wait "${ID}" -a beanquest --state stopped --wait-timeout 5m
          flyctl logs -a beanquest -m "${ID}" --no-tail || true
          # Fly omits exit_code on a clean exit, so a missing code means 0. A missing exit
          # event or requested_stop means the machine was stopped from outside: fail.
          CODE="$(flyctl machine list -a beanquest --json | jq -r --arg id "${ID}" '
            [.[] | select(.id == $id) | .events[] | select(.type == "exit")][0].request.exit_event
            | if . == null or .requested_stop == true
              then error("migrator machine did not exit on its own")
              else (.exit_code // 0) end')"
          echo "dbmate exit code: ${CODE}"
          exit "${CODE}"

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Matrix legs can't hand back per-image outputs, so read the app image's digest from the registry.
      - name: Resolve image digest
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            Published to `ghcr.io/${{ github.repository }}`.

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
            ```

            **Digest:** `${{ steps.image.outputs.digest }}`

  deploy:
    name: Deploy to Fly.io
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy
        run: flyctl deploy --image "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
