name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --with=dev --no-root
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: "1"
      - name: Lint
        run: poetry run pycodestyle
      - name: Test
        run: poetry run pytest

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: beanquest
          POSTGRES_PASSWORD: beanquest
          POSTGRES_DB: beanquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beanquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://beanquest:beanquest@localhost:5432/beanquest?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build migrator image
        run: docker build -f docker/beanquest-migrator/Dockerfile -t beanquest-migrator .
      - name: Migrate
        run: docker run --rm --network host -e DATABASE_URL beanquest-migrator
      - name: Migrate again (must be a no-op)
        run: docker run --rm --network host -e DATABASE_URL beanquest-migrator
      - name: Status (nothing pending)
        run: |
          docker run --rm --network host -e DATABASE_URL beanquest-migrator status | tee status.txt
          grep -q '^Pending: 0$' status.txt
      - name: Rollback is refused for baseline migrations
        run: "! docker run --rm --network host -e DATABASE_URL beanquest-migrator rollback"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Test
        run: npm run test:coverage

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
