[project]
name = "beanquest"
version = "0.1.0"
description = "Coffee sourcing, roasting, and extraction tracking"
authors = [
    { name = "Peter Han", email = "peter@ketch.com" },
]
license = {text = "MIT"}
readme = "README.md"
# Docker runs Python 3.13 (python:3.13-slim), so the Python version is locked to 3.13
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "psycopg-pool (>=3.3.0,<4.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.5,<3.0"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pycodestyle (>=2.14.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.27,<1.0)",
]
